name: keploy-agent

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "scripts/**"
      - ".github/workflows/keploy-agent.yml"
      - ".github/workflows/main.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "scripts/**"
      - ".github/workflows/keploy-agent.yml"
      - ".github/workflows/main.yml"

jobs:
  rows:
    # tests/: the control socket is bound before the import returns, and
    # every command the agent reads gets one answer line before the close.
    name: rows (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One leg failing must not cancel the other: each leg's result is its
      # own.
      fail-fast: false
      matrix:
        # The oldest Python the agent runs on (it uses Path.is_relative_to,
        # new in 3.9) and the newest. pytest 9 needs Python 3.10.
        # actions/setup-python has no Python 3.9 build for ubuntu-latest
        # (Ubuntu 26.04), so the 3.9 leg runs on ubuntu-24.04.
        include:
          - { python: "3.9", pytest: "8.4.2", os: ubuntu-24.04 }
          - { python: "3.14", pytest: "9.2.0", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest==${{ matrix.pytest }}"
      - run: python -m pytest -p no:cacheprovider tests

  lint:
    # Pyflakes' checks (undefined names, unused imports and the like) and
    # syntax errors. ruff's other default rules are about style.
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==0.14.4"
      - run: ruff check --select F,E9 src tests

  package:
    # The build main.yml publishes on a GitHub release, with no upload:
    # scripts/check_package.sh, the file main.yml runs before its upload, on
    # the same Python. One wheel and one sdist of keploy-agent, metadata PyPI
    # can render (README.md is the project page), and a wheel that installs
    # with nothing else and imports from outside the checkout.
    name: package (build, no upload)
    runs-on: ubuntu-latest
    # A minute's work: a run past 10 is a hang.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash # -eo pipefail: a failed command before a pipe fails the step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The Python main.yml builds with.
          python-version: "3.14"
      - name: A release under another tag is refused, before any build
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_ENV"
          for tag in "" "v$version" "$version" "keploy-pytest-v$version" "keploy-agent-v${version}0" "keploy-agent-$version"; do
            if out=$(scripts/check_package.sh "$tag"); then
              echo "::error::check_package.sh took the tag '$tag'"
              exit 1
            fi
            echo "$out"
            test "$(echo "$out" | wc -l)" = 1
            echo "$out" | grep -q "^::error::the release tag "
            test ! -e dist
          done
      - name: Under its own tag, the build passes the checks a release runs before its upload
        run: scripts/check_package.sh "keploy-agent-v$version"
