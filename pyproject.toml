# pyproject.toml

[build-system]
# 77: the first setuptools that takes the license as an SPDX expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "keploy-agent"
version = "0.1.1"
authors = [
  { name="Keploy Team", email="hello@keploy.io" },
]
description = "A side-effect agent for collecting Python code coverage during Keploy test runs."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]

# The agent uses the standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/keploy/python-sdk"
"Bug Tracker" = "https://github.com/keploy/python-sdk/issues"
