[build-system]
# 77 is the first setuptools to read an SPDX license expression.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keploy-pytest"
version = "0.1.0"
description = "Join a pytest suite to keploy's Universal Mocker: keploy mock record and keploy mock replay judge each test."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Keploy", email = "hello@keploy.io" }]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
]
# pytest 8 is the first whose hook wrappers this plugin uses (wrapper=True).
dependencies = ["pytest>=8.0"]

[project.entry-points.pytest11]
keploy = "keploy_pytest.plugin"

[project.urls]
Homepage = "https://github.com/keploy/python-sdk/tree/main/keploy-pytest"

[tool.setuptools.packages.find]
where = ["src"]
